[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "punishment-api"
version = "0.1.0"
description = "FastAPI service for criminal punishment range calculation"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
